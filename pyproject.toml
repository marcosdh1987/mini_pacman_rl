[project]
name = "mini-pacman-rl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "streamlit>=1.50,<2",
    "torch>=2.3,<3",
]

# This demo trains a tiny 2-layer net on a 5x5 grid: no GPU is needed, so we
# pin torch to the CPU-only wheel index to avoid pulling multi-GB CUDA deps.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
